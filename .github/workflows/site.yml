# Publication du site voxlivre.store (ADR-0020, ADR-0031) : export statique
# Next.js de `web/`.
#
# Indépendant du déploiement de l'API : modifier la page ne reconstruit pas
# d'image. Même rôle OIDC que le job Deploy (environnement
# `production`, réservé à master), limité au bucket du site et à
# l'invalidation de sa distribution (infra/modules/cicd).

name: Site

on:
  push:
    branches: [master]
    paths:
      - 'web/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish site
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ env.SITE_URL }}
    permissions:
      contents: read
      id-token: write # jeton OIDC pour AWS
    concurrency:
      group: site
      cancel-in-progress: false
    env:
      SITE_URL: https://voxlivre.store
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # Construction avant les identifiants AWS : aucun code de dépendance ne
      # s'exécute avec eux en mémoire. Actions épinglées par SHA : leurs étapes
      # de fin (cache) tournent après la configuration des identifiants.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-3
          mask-aws-account-id: true
      # Fichiers à nom haché (`_next/static/`) d'abord, en cache d'un an et
      # jamais supprimés (une page encore en cache peut les demander). Puis le
      # reste, 5 minutes, avec `--delete` sauf les APK (`telecharger/`, envoyés
      # par web/scripts/publish-apk.sh) ; CloudFront est invalidé juste après.
      - name: Sync
        env:
          BUCKET: ${{ secrets.SITE_BUCKET }}
        run: |
          aws s3 sync web/out/_next/static/ "s3://$BUCKET/_next/static/" \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 sync web/out/ "s3://$BUCKET/" --delete \
            --exclude 'telecharger/*' --exclude '_next/static/*' \
            --cache-control "public, max-age=300"
          # Sous-titres : le type deviné par `sync` dépend des types MIME du
          # runner ; un navigateur ignore une piste qui n'est pas en `text/vtt`.
          aws s3 cp web/out/video/ "s3://$BUCKET/video/" --recursive \
            --exclude '*' --include '*.vtt' \
            --content-type 'text/vtt; charset=utf-8' --cache-control "public, max-age=300"
      - name: Invalidate
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.SITE_DISTRIBUTION_ID }}" \
            --paths '/*' \
            --query 'Invalidation.Id' --output text
      - name: Check
        run: curl -fsS -o /dev/null -w '%{http_code}\n' "$SITE_URL/"
